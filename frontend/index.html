<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Fond du Hero de la page d'accueil (Home.scss, .home-hero__photo-wrap::before) :
         image de fond CSS, donc invisible au préchargeur HTML sans cet indice explicite.
         Probable élément LCP — préchargée en priorité haute (cf. audit performance). -->
    <link rel="preload" as="image" href="/66partners/hero.webp" fetchpriority="high" />

    <meta
      name="description"
      content="66Partners connecte les sportifs : trouve un partenaire, crée ou rejoins une activité sportive près de chez toi."
    />
    <title>66Partners</title>

    <meta name="theme-color" content="#E6392E" />

    <!-- iOS ne lit pas le manifest pour l'installation : ces balises sont
         nécessaires en plus pour un rendu correct en PWA sur Safari/iPhone. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="66Partners" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="sport-icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E6392E" />
          <stop offset="55%" stop-color="#F66A1A" />
          <stop offset="100%" stop-color="#F4A61D" />
        </linearGradient>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
