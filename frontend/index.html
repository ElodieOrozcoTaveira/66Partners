<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Fond du Hero de la page d'accueil (Home.scss, .home-hero__photo-wrap::before) :
         image de fond CSS, donc invisible au préchargeur HTML sans cet indice explicite.
         Probable élément LCP — préchargée en priorité haute (cf. audit performance). -->
    <link rel="preload" as="image" href="/66partners/hero.webp" fetchpriority="high" />

    <meta
      name="description"
      content="66Partners connecte les sportifs : trouve un partenaire, crée ou rejoins une activité sportive près de chez toi."
    />
    <title>66Partners</title>
    <link rel="canonical" href="https://66partners.fr/" />

    <!-- Aperçu des liens partagés (WhatsApp, Facebook, Messenger, X…). Les
         robots de partage ne lisent pas le JavaScript : valeurs fixes ici. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="66Partners" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://66partners.fr/" />
    <meta property="og:title" content="66Partners — Trouve ton partenaire de sport près de chez toi" />
    <meta
      property="og:description"
      content="Crée ou rejoins une sortie sportive en Occitanie : running, vélo, rando, padel… Gratuit, et ta prochaine sortie est peut-être déjà en ligne."
    />
    <meta property="og:image" content="https://66partners.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="66Partners, sportifs à vélo face aux Pyrénées" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="66Partners — Trouve ton partenaire de sport près de chez toi" />
    <meta
      name="twitter:description"
      content="Crée ou rejoins une sortie sportive en Occitanie. Gratuit, sur ordinateur comme sur téléphone."
    />
    <meta name="twitter:image" content="https://66partners.fr/og-image.jpg" />

    <meta name="theme-color" content="#C4121A" />

    <!-- iOS ne lit pas le manifest pour l'installation : ces balises sont
         nécessaires en plus pour un rendu correct en PWA sur Safari/iPhone. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="66Partners" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="sport-icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color: var(--brand-primary-dark, #930D13)" />
          <stop offset="55%" style="stop-color: var(--brand-primary, #C4121A)" />
          <stop offset="100%" style="stop-color: color-mix(in srgb, var(--brand-primary, #C4121A) 78%, white)" />
        </linearGradient>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
