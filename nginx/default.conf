# ── Réglages communs ─────────────────────────────────────────────────────────
# Compression des réponses texte (JS, CSS, JSON, SVG…) : ~3 fois moins de
# données sur téléphone. Les images (webp, jpg, png) sont déjà compressées.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/javascript application/json
           application/manifest+json application/xml image/svg+xml font/ttf;

# Photos envoyées (avatar, couverture, photos d'activité) : l'API accepte
# jusqu'à 5 Mo ; la valeur par défaut de nginx (1 Mo) les bloquait.
client_max_body_size 10m;

# Cache selon le fichier : un seul add_header au niveau server (un add_header
# dans une location annule tous ceux hérités, dont les en-têtes de sécurité).
map $uri $cache_control {
    ~*\.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|eot)$  "public, max-age=31536000, immutable";
    /sw.js                    "no-cache, no-store, must-revalidate";
    /registerSW.js            "no-cache, no-store, must-revalidate";
    /manifest.webmanifest     "no-cache, no-store, must-revalidate";
    /index.html               "no-cache, no-store, must-revalidate";
    default                   "";
}

# ── HTTP : challenge ACME + redirection HTTPS (tous les domaines) ───────────
server {
    listen 80;
    server_name 66partners.fr www.66partners.fr api.66partners.fr;

    # Validation Let's Encrypt en mode webroot (certbot écrit dans
    # /var/www/certbot sur l'hôte, monté en lecture seule ici). La redirection
    # doit rester dans "location /" : un "return" au niveau server s'exécute
    # avant toute location et casserait le challenge ACME.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www.66partners.fr → origine canonique https://66partners.fr ─────────────
# Une seule origine servie : l'API n'autorise que https://66partners.fr
# (CORS_ORIGIN), et les origines OAuth n'y sont déclarées qu'une fois.
# Le certificat couvre www par SAN : la poignée TLS aboutit avant la redirection.
server {
    listen 443 ssl;
    server_name www.66partners.fr;

    ssl_certificate     /etc/letsencrypt/live/66partners.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/66partners.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://66partners.fr$request_uri;
}

# ── Frontend : 66partners.fr ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name 66partners.fr;

    ssl_certificate     /etc/letsencrypt/live/66partners.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/66partners.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Photos uploadées : référencées en chemin relatif ("/uploads/xxx.jpg",
    # cf. UserController), donc résolues contre CE domaine — seule l'API a
    # les fichiers, sans ce proxy elles retombent sur index.html.
    location /uploads/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # En-têtes de sécurité (HTTPS forcé, pas d'affichage du site dans le
    # cadre d'un autre site, pas de devinette du type des fichiers).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Cache-Control $cache_control;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
    }

    # Modules JS .mjs (worker de la carte MapLibre) : absents des types connus
    # de nginx, ils partiraient en binaire et seraient refusés (nosniff).
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        types { }
        default_type application/javascript;
    }
}

# ── API : api.66partners.fr ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.66partners.fr;

    ssl_certificate     /etc/letsencrypt/live/66partners.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/66partners.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # REST + Swagger
    location / {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io (WebSocket)
    location /socket.io/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
