# Config nginx dédiée au STAGING — domaines et certificat distincts de la
# PROD (nginx/default.conf n'est jamais modifié pour ce chantier). Servie par
# le conteneur frontend-staging (image construite depuis frontend/Dockerfile.prod
# avec ARG NGINX_CONF=nginx/staging.conf).

# ── Redirection HTTP → HTTPS (les deux domaines staging) ────────────────────
server {
    listen 80;
    server_name staging.66partners.fr api-staging.66partners.fr;
    return 301 https://$host$request_uri;
}

# ── Frontend : staging.66partners.fr ─────────────────────────────────────────
server {
    listen 443 ssl;
    server_name staging.66partners.fr;

    ssl_certificate     /etc/letsencrypt/live/staging.66partners.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.66partners.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Environnement de test réservé aux testeurs : jamais indexé.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        }
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Bloque explicitement l'indexation même si un moteur ignore l'en-tête HTTP.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}

# ── API : api-staging.66partners.fr ──────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api-staging.66partners.fr;

    ssl_certificate     /etc/letsencrypt/live/staging.66partners.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.66partners.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # REST + Swagger
    location / {
        proxy_pass         http://api-staging:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io (WebSocket)
    location /socket.io/ {
        proxy_pass         http://api-staging:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
