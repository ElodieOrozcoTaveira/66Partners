services:
  client:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
    environment:
      # Vide : les requêtes passent en relatif (/api/...) et sont proxiées par
      # Vite vers le service "api" (voir frontend/vite.config.ts). Fonctionne
      # aussi bien en local qu'à travers un tunnel ngrok.
      - VITE_API_URL=
      # Lorsque le client tourne dans Docker, forcer la cible du proxy vers
      # le service `api` du même réseau compose.
      - VITE_DEV_PROXY_TARGET=http://api:3000
    depends_on:
      - api
    # `npm install` avant `dev` : les node_modules vivent dans des volumes
    # anonymes qui ne se resynchronisent pas tout seuls avec package.json
    # après un `git pull` (nouvelle dépendance ajoutée). Sans ça, il faut
    # reconstruire l'image ou lancer `npm install` à la main à chaque fois.
    command: sh -c "npm install && npm run dev"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file: 
     - .env  
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Même remarque que côté client : `npm install` garde node_modules à jour
    # avec package.json malgré le volume anonyme, sans étape manuelle après pull.
    command: sh -c "npm install && npx drizzle-kit migrate && npm run dev"

  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  db_data:
  redis-data:
